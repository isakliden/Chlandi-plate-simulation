[package]
name = "chladni_visualizer"
version = "0.1.0"
edition = "2021"
description = "Real-time GPU compute Chladni plate cymatics audio visualizer"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
cpal = "0.18"
rtrb = "0.4"
rustfft = "6.4"
bytemuck = { version = "1.24", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
